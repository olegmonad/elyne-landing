<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELYNE · Афиша</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0d0d0d);
    --bg2: var(--tg-theme-secondary-bg-color, #1a1a1a);
    --text: var(--tg-theme-text-color, #f0f0f0);
    --hint: var(--tg-theme-hint-color, #888);
    --link: var(--tg-theme-link-color, #c4a95e);
    --btn: var(--tg-theme-button-color, #c4a95e);
    --btn-text: var(--tg-theme-button-text-color, #000);
    --card: #1e1e1e;
    --border: rgba(255,255,255,0.07);
    --active-day: var(--btn);
    --pill-active-bg: var(--btn);
    --pill-active-text: var(--btn-text);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom, 16px);
  }

  /* Header */
  .header {
    padding: 16px 16px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-subtitle {
    font-size: 13px;
    color: var(--hint);
    margin-top: 2px;
  }
  .updated-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4CAF50;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* Week strip */
  .week-strip {
    padding: 14px 16px 0;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .week-strip::-webkit-scrollbar { display: none; }

  .day-pill {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--bg2);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    border: 1.5px solid transparent;
  }
  .day-pill.active {
    background: var(--pill-active-bg);
    color: var(--pill-active-text);
    font-weight: 600;
  }
  .day-pill.today-pill:not(.active) {
    border-color: var(--btn);
  }
  .day-pill .day-name {
    font-size: 12px;
    color: inherit;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .day-pill.active .day-name { opacity: 0.8; }
  .day-pill .day-num {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
    margin-top: 2px;
  }
  .day-pill .day-count {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 1px;
  }

  /* Category filter */
  .cat-strip {
    padding: 12px 16px 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-strip::-webkit-scrollbar { display: none; }

  .cat-pill {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 14px;
    font-size: 13px;
    background: var(--bg2);
    color: var(--hint);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .cat-pill.active {
    background: var(--pill-active-bg);
    color: var(--pill-active-text);
    font-weight: 600;
  }

  /* Events list */
  .events-section {
    padding: 16px 16px 0;
  }
  .section-label {
    font-size: 12px;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .event-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: opacity 0.1s;
    position: relative;
    overflow: hidden;
  }
  .event-card:active { opacity: 0.7; }

  .event-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--cat-color, var(--btn));
    border-radius: 3px 0 0 3px;
  }

  .event-card[data-cat="культура"]::before { background: #E57373; }
  .event-card[data-cat="wellbeing"]::before { background: #81C784; }
  .event-card[data-cat="спорт"]::before { background: #64B5F6; }
  .event-card[data-cat="наука"]::before { background: #BA68C8; }
  .event-card[data-cat="бизнес"]::before { background: #FFB74D; }
  .event-card[data-cat="праздник"]::before { background: #F06292; }

  .event-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .event-emoji {
    font-size: 22px;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .event-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    flex: 1;
  }
  .event-meta {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-left: 32px;
  }
  .meta-tag {
    font-size: 12px;
    color: var(--hint);
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .event-price {
    margin-left: auto;
    font-size: 12px;
    color: var(--link);
    font-weight: 600;
    flex-shrink: 0;
  }
  .event-desc {
    margin-top: 8px;
    padding-left: 32px;
    font-size: 13px;
    color: var(--hint);
    line-height: 1.5;
  }
  .event-link-row {
    margin-top: 10px;
    padding-left: 32px;
    display: flex;
    gap: 8px;
  }
  .event-btn {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    text-decoration: none;
    display: inline-block;
  }
  .event-btn.primary {
    background: var(--btn);
    color: var(--btn-text);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--hint);
  }
  .empty-emoji { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; }

  /* Footer */
  .footer {
    padding: 20px 16px 8px;
    font-size: 11px;
    color: var(--hint);
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📅 Афиша</div>
    <div class="header-subtitle" id="updated-label">Загружаю события…</div>
  </div>
  <div class="updated-dot" id="status-dot" style="background:#888"></div>
</div>

<div class="week-strip" id="week-strip"></div>
<div class="cat-strip" id="cat-strip"></div>
<div class="events-section" id="events-section"></div>
<div class="footer" id="footer"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const EVENTS_URL = 'https://olegmonad.github.io/elyne-landing/community/events.json';
const TG_BASE = 'https://t.me/c/1003993020463/';

const DAYS_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTHS_RU = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS_FULL = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const CATS = ['Все','Культура','Wellbeing','Спорт','Наука','Бизнес','Праздник'];
const CAT_KEYS = ['все','культура','wellbeing','спорт','наука','бизнес','праздник'];

let allEvents = [];
let selectedDate = null;
let selectedCat = 'все';

function isoToDate(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDateFull(iso) {
  const d = isoToDate(iso);
  return `${d.getDate()} ${MONTHS_FULL[d.getMonth()]}`;
}

function todayIso() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

function addDays(iso, n) {
  const d = isoToDate(iso);
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function renderWeekStrip(events) {
  const today = todayIso();
  const strip = document.getElementById('week-strip');
  strip.innerHTML = '';

  const days = Array.from({length:8}, (_,i) => addDays(today, i));
  days.forEach(iso => {
    const d = isoToDate(iso);
    const count = events.filter(e => e.date === iso).length;
    const pill = document.createElement('div');
    pill.className = 'day-pill' + (iso === today ? ' today-pill' : '') + (iso === selectedDate ? ' active' : '');
    pill.innerHTML = `
      <div class="day-name">${DAYS_RU[d.getDay()]}</div>
      <div class="day-num">${d.getDate()}</div>
      ${count > 0 ? `<div class="day-count">${count} ${count===1?'событие':count<5?'события':'событий'}</div>` : '<div class="day-count">—</div>'}
    `;
    pill.onclick = () => {
      selectedDate = (selectedDate === iso) ? null : iso;
      renderWeekStrip(events);
      renderEvents();
    };
    strip.appendChild(pill);
  });
}

function renderCatStrip() {
  const strip = document.getElementById('cat-strip');
  strip.innerHTML = '';
  CATS.forEach((label, i) => {
    const key = CAT_KEYS[i];
    const pill = document.createElement('div');
    pill.className = 'cat-pill' + (selectedCat === key ? ' active' : '');
    pill.textContent = label;
    pill.onclick = () => { selectedCat = key; renderCatStrip(); renderEvents(); };
    strip.appendChild(pill);
  });
}

function renderEvents() {
  const section = document.getElementById('events-section');

  let filtered = allEvents;
  if (selectedDate) filtered = filtered.filter(e => e.date === selectedDate);
  if (selectedCat !== 'все') filtered = filtered.filter(e => e.category === selectedCat);

  // group by date
  const groups = {};
  filtered.forEach(e => {
    if (!groups[e.date]) groups[e.date] = [];
    groups[e.date].push(e);
  });

  const sortedDates = Object.keys(groups).sort();

  if (sortedDates.length === 0) {
    section.innerHTML = `<div class="empty"><div class="empty-emoji">🌿</div><div class="empty-text">Событий не найдено</div></div>`;
    return;
  }

  section.innerHTML = sortedDates.map(date => {
    const today = todayIso();
    let label;
    if (date === today) label = `Сегодня, ${formatDateFull(date)}`;
    else if (date === addDays(today, 1)) label = `Завтра, ${formatDateFull(date)}`;
    else label = formatDateFull(date);

    const cards = groups[date].map(ev => {
      const tgLink = ev.tg_msg_id ? `${TG_BASE}${ev.tg_msg_id}` : null;
      const linksHtml = [
        ev.url ? `<a class="event-btn primary" href="${ev.url}" target="_blank">Источник</a>` : '',
        tgLink ? `<a class="event-btn" href="${tgLink}" target="_blank">В Афише</a>` : ''
      ].filter(Boolean).join('');

      return `<div class="event-card" data-cat="${ev.category}">
        <div class="event-header">
          <div class="event-emoji">${ev.emoji || '📌'}</div>
          <div class="event-title">${ev.title}</div>
        </div>
        <div class="event-meta">
          <span class="meta-tag">📍 ${ev.place}</span>
          ${ev.time ? `<span class="meta-tag">🕐 ${ev.time}</span>` : ''}
          <span class="event-price">${ev.is_free ? 'Бесплатно' : (ev.price || '')}</span>
        </div>
        ${ev.description ? `<div class="event-desc">${ev.description}</div>` : ''}
        ${linksHtml ? `<div class="event-link-row">${linksHtml}</div>` : ''}
      </div>`;
    }).join('');

    return `<div class="section-label">${label}</div>${cards}`;
  }).join('');
}

async function loadEvents() {
  const label = document.getElementById('updated-label');
  const dot = document.getElementById('status-dot');
  const footer = document.getElementById('footer');
  try {
    const resp = await fetch(EVENTS_URL + '?v=' + Date.now());
    const data = await resp.json();
    allEvents = data.events || [];

    const upd = data.updated ? new Date(data.updated) : null;
    const updStr = upd ? `${upd.getDate()} ${MONTHS_RU[upd.getMonth()]} ${String(upd.getHours()).padStart(2,'0')}:${String(upd.getMinutes()).padStart(2,'0')}` : '';
    label.textContent = updStr ? `Обновлено ${updStr}` : 'Актуально';
    dot.style.background = '#4CAF50';

    selectedDate = todayIso();
    renderWeekStrip(allEvents);
    renderCatStrip();
    renderEvents();

    footer.textContent = `${allEvents.length} событий · ELYNE Community`;
  } catch(e) {
    label.textContent = 'Ошибка загрузки';
    dot.style.background = '#E57373';
    document.getElementById('events-section').innerHTML =
      `<div class="empty"><div class="empty-emoji">⚠️</div><div class="empty-text">Не удалось загрузить события</div></div>`;
  }
}

loadEvents();
</script>
</body>
</html>
