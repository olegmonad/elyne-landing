<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Афиша переехала — VELENIE</title>
<link rel="canonical" href="https://velenie.ai/afisha/">
<style>
  html,body{margin:0;height:100%;background:#0d0d0d;color:#f2ede3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:32px;text-align:center;box-sizing:border-box}
  h1{font-size:20px;font-weight:500;margin:0;letter-spacing:.02em}
  p{margin:0;font-size:15px;line-height:1.5;color:#a8a29a;max-width:300px}
  a{display:inline-block;margin-top:10px;padding:13px 22px;border-radius:12px;
    background:#c4a95e;color:#0d0d0d;text-decoration:none;font-weight:600;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Афиша переехала</h1>
  <p>Теперь она живёт на новом адресе — <b>velenie.ai/afisha</b>. Переношу вас туда.</p>
  <a id="go" href="https://velenie.ai/afisha/">Открыть афишу</a>
</div>
<script>
  // Переносим и параметры ссылки, и данные Telegram из хеша — иначе внутри
  // мини-приложения потерялся бы вход по конкретному событию (?startapp=ID).
  var target = 'https://velenie.ai/afisha/' + location.search + location.hash;
  document.getElementById('go').href = target;
  location.replace(target);
</script>
</body>
</html>
